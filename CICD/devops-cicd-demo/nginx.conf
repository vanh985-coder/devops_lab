server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Health endpoint cho CI/CD và script health-check.sh
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
